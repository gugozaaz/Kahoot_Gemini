version: '3.8'

services:
  backend:
    build: ./backend
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # Cloudflare Tunnel
  # Replace <YOUR_TOKEN> with your actual Cloudflare Tunnel token.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token <YOUR_TOKEN>
    restart: unless-stopped
    depends_on:
      - nginx
